name: Fuzz (long)

# 10 minutes per discovered target, nightly. The per-pull-request 60 s smoke run
# lives in ci.yml.
#
# Split out of the former combined `Nightly` workflow so it can be dispatched on
# its own: bundled with the interop matrix, asking for a fuzz campaign also
# started a multi-hour server matrix, and a run that expensive to trigger is a
# run nobody triggers. Mirrors the sibling go-imap repository's layout.

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Duration per target
        required: false
        default: '10m'

permissions:
  contents: read

concurrency:
  group: fuzz-long
  cancel-in-progress: false

env:
  # Keep in step with ci.yml's GO_VERSION.
  GO_VERSION: '1.26.x'

jobs:
  fuzz-long:
    name: Fuzz long-run (${{ github.event.inputs.fuzztime || '10m' }} per discovered target)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Campaign
        env:
          FUZZTIME: ${{ github.event.inputs.fuzztime || '10m' }}
        run: .github/scripts/run-fuzz.sh "$FUZZTIME" 2
      - name: Upload any crashers
        # A crasher is a corpus file the engine wrote into the working tree.
        # It must reach the repository rather than evaporate with the runner —
        # it is the reproducer, and regenerating it costs another six-hour
        # campaign.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-long-crashers
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
          retention-days: 30
      - name: Report a crasher
        if: failure()
        run: |
          # --ignored as well as --untracked: .gitignore excludes
          # testdata/fuzz/*/crash-*, so a plain status would hide exactly the
          # files this step exists to surface.
          crashers="$(git status --porcelain --untracked-files=all \
            --ignored=matching -- '*testdata/fuzz*')"
          if [ -n "$crashers" ]; then
            {
              echo "### New fuzz crashers"
              echo
              echo 'Commit these into the corpus with the fix:'
              echo '```'
              echo "$crashers"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
          else
            echo "no crasher files written; see the campaign table for the failure" \
              >>"$GITHUB_STEP_SUMMARY"
          fi
