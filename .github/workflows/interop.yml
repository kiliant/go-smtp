name: Interop

# Real servers under a container runtime. Correctness against the RFC is
# necessary but not sufficient: servers disagree, and the disagreements are
# where client bugs live.
#
# On every push to main and nightly, so a regression against a real server
# surfaces on the merge that caused it. The harness skips on absent
# capabilities rather than failing, so a run here is informative rather than
# blocking.
#
# Structurally identical to the sibling go-imap repository's interop.yml —
# same triggers, same two jobs, same names. Only the test package list and the
# server-subset variable differ.

on:
  push:
    branches: [main]
  schedule:
    # Nightly, 03:17 UTC. Off the hour so this run does not queue behind every
    # other project's midnight cron. Same slot as the sibling repository's.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      servers:
        description: 'Comma-separated subset (GO_SMTP_INTEROP_SERVERS); empty means all'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: interop-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in step with ci.yml's GO_VERSION.
  GO_VERSION: '1.26.x'

jobs:
  interop:
    name: interop (native profiles)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GO_SMTP_INTEROP_SERVERS: ${{ github.event.inputs.servers }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: container engine
        run: .github/scripts/container-engine.sh

      # The suites below must stay separate and sequential. Go runs one test
      # process per package, and every process with a TestMain using the harness
      # owns an independent container lifecycle; combining the package lists
      # starts those lifecycles concurrently, which means several copies of every
      # server image competing for the same runner.
      - name: native matrix, sequentially
        run: .github/scripts/run-interop.sh interop

      - name: container diagnostics
        if: failure()
        run: podman ps -a || true

  interop-emulated:
    # Tier 3, amd64-only images. Hosted runners are amd64, so on GitHub this is
    # native and the tag is only what enables the profiles — on the arm64 dev
    # host it genuinely emulates. Not on push either way, because these are the
    # slowest images in the matrix.
    name: interop (emulated profiles)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: container engine
        run: .github/scripts/container-engine.sh

      - name: enable cross-architecture execution
        # A no-op on an amd64 runner; present so this job behaves the same way
        # if it is ever moved to an arm64 runner.
        run: |
          if [ "$(uname -m)" != "x86_64" ]; then
            podman run --rm --privileged docker.io/tonistiigi/binfmt:latest --install amd64
          else
            echo "runner is amd64; the tier 3 images run natively here"
          fi

      - name: native and Tier 3 matrix, sequentially
        run: .github/scripts/run-interop.sh 'interop interop_emulated'
