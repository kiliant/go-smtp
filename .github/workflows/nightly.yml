name: Nightly

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      include_emulated:
        description: Include Tier 3 amd64-emulated interop profiles
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  fuzz-long:
    name: Fuzz long-run (10m per discovered target)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache: false
      - run: .github/scripts/run-fuzz.sh 10m 2

  interop:
    name: Podman interoperability matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache: false
      - name: Verify pinned runner Podman
        run: |
          podman --version
          podman --version | grep -Fx 'podman version 4.9.3'
      - name: Run native matrix sequentially
        if: ${{ !inputs.include_emulated }}
        run: .github/scripts/run-interop.sh interop
      - name: Run native and Tier 3 matrix sequentially
        if: ${{ inputs.include_emulated }}
        run: .github/scripts/run-interop.sh 'interop interop_emulated'
