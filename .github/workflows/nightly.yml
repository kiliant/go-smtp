name: Nightly

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      include_emulated:
        description: Include Tier 3 amd64-emulated interop profiles
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  # Keep in step with ci.yml's GO_VERSION.
  GO_VERSION: '1.26.x'

jobs:
  fuzz-long:
    name: Fuzz long-run (10m per discovered target)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: .github/scripts/run-fuzz.sh 10m 2
      - name: Upload any crashers
        # A crasher is a corpus file the engine wrote into the working tree.
        # It must reach the repository rather than evaporate with the runner —
        # it is the reproducer, and regenerating it costs another six-hour
        # campaign.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-long-crashers
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
          retention-days: 30
      - name: Report a crasher
        if: failure()
        run: |
          # --ignored as well as --untracked: .gitignore excludes
          # testdata/fuzz/*/crash-*, so a plain status would hide exactly the
          # files this step exists to surface.
          crashers="$(git status --porcelain --untracked-files=all \
            --ignored=matching -- '*testdata/fuzz*')"
          if [ -n "$crashers" ]; then
            {
              echo "### New fuzz crashers"
              echo
              echo 'Commit these into the corpus with the fix:'
              echo '```'
              echo "$crashers"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
          else
            echo "no crasher files written; see the campaign table for the failure" \
              >>"$GITHUB_STEP_SUMMARY"
          fi

  interop:
    name: Podman interoperability matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Container engine
        run: .github/scripts/container-engine.sh
      - name: Run native matrix sequentially
        if: ${{ !inputs.include_emulated }}
        run: .github/scripts/run-interop.sh interop
      - name: Run native and Tier 3 matrix sequentially
        if: ${{ inputs.include_emulated }}
        run: .github/scripts/run-interop.sh 'interop interop_emulated'
