primary_hostname = exim-sender.example.test
domainlist local_domains =

acl_smtp_rcpt = accept_all
acl_smtp_data = accept_all
smtp_banner = $primary_hostname ESMTP Exim sender ready

begin acl

accept_all:
  accept

begin routers

gosmtp_relay:
  driver = manualroute
  domains = *
  transport = gosmtp_smtp
  route_list = * host.containers.internal::__GOSMTP_PORT__ byname
  no_more

begin transports

gosmtp_smtp:
  driver = smtp

begin retry

* * F,2m,10s

begin rewrite

begin authenticators
