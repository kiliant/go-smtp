# passwd-file rather than a catch-all "static" userdb: the interop suite
# needs Dovecot to reject an unrecognised recipient at RCPT (a real per-user
# lookup failure, exercised in smtpclient/lmtp_interop_test.go) as well as
# accept the provisioned accounts, which a static/catch-all userdb cannot
# express. See ./users for the account list.
userdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}

service lmtp {
  inet_listener lmtp {
    port = 24
  }
  inet_listener lmtps {
    port = 31024
    ssl = yes
  }
}
