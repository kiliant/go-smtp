# Minimal maddy configuration for the interop matrix: one local domain and one
# mailbox, provisioned by entrypoint.sh and verified end to end by the matrix.

$(hostname) = mail.example.test
$(primary_domain) = example.test
$(local_domains) = $(primary_domain)

hostname $(hostname)

tls file /data/certs/cert.pem /data/certs/key.pem

storage.imapsql local_mailboxes {
    driver sqlite3
    dsn /data/imapsql.db
    msg_store fs /data/mail
}

smtp tcp://0.0.0.0:25 {
    limits {
        all rate 20 1s
    }

    default_source {
        # The harness deliberately sends only to this provisioned local
        # mailbox. maddy requires an explicit local-part match rule; the
        # previous domain-only form was not valid configuration grammar.
        destination interop $(local_domains) {
            deliver_to &local_mailboxes
        }
        default_destination {
            reject 550 5.1.1 "User doesn't exist"
        }
    }
}
