# Minimal maddy configuration for the interop matrix: one local domain, one
# mailbox. NOT LIVE-VERIFIED this session — see profile.go.

$(hostname) = mail.example.test
$(primary_domain) = example.test

tls file /certs/cert.pem /certs/key.pem

storage.imapsql local_mailboxes {
    driver sqlite3
    dsn /data/imapsql.db
}

auth.pass_table local_authdb {
    table sql_table {
        driver sqlite3
        dsn /data/credentials.db
        table_name passwords
    }
}

smtp tcp://0.0.0.0:25 {
    limits {
        all rate 20 1s
    }

    dmarc yes
    check {
        require_mx_record
    }

    source $(local_domains) {
        destination $(local_domains) {
            deliver_to &local_mailboxes
        }
        default_destination {
            reject 550 5.1.1 "User doesn't exist"
        }
    }

    default_source {
        reject 550 5.7.1 "Relaying denied"
    }
}
